# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Python deps are managed solely by Poetry (pyproject.toml + poetry.lock). There is
# deliberately NO requirements.txt in the repo: it is generated at deploy time by
# .github/workflows/sync-to-hf.yml (poetry export) and pushed only to the Hugging
# Face Space. This keeps Dependabot focused on pyproject.toml/poetry.lock — when a
# committed requirements.txt also existed, Dependabot bumped its pins independently
# of the lock, producing unmergeable PRs. Updates are grouped into one weekly PR so
# the lock is re-resolved once per cycle.

version: 2
updates:
  - package-ecosystem: "pip" # Poetry project (pyproject.toml + poetry.lock)
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
