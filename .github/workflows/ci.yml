name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --all-extras

      - name: Lint and check formatting with Ruff
        run: |
          poetry run ruff check src/ tests/ app.py
          poetry run ruff format --check src/ tests/ app.py

      - name: Type check with mypy
        run: poetry run mypy src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --all-extras

      - name: Run tests with coverage
        run: |
          poetry run pytest tests/ \
            --cov=src/cryptrink \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            -v \
            -m "not integration"

      - name: Generate coverage badge
        run: |
          python .github/scripts/generate_badge.py

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: .github/badges/coverage.svg


  coverage-pages:
    name: Publish Coverage Badge (Pages)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download coverage badge artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: badge

      - name: Prepare Pages content
        run: |
          mkdir -p site
          cp badge/coverage.svg site/coverage.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: coverage-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run integration tests if secrets are available
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.13-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --all-extras

      - name: Run integration tests
        env:
          REVOLUTX_API_KEY: ${{ secrets.REVOLUTX_API_KEY }}
          REVOLUTX_PRIVATE_KEY: ${{ secrets.REVOLUTX_PRIVATE_KEY }}
          REVOLUTX_BASE_URL: ${{ secrets.REVOLUTX_BASE_URL }}
        run: |
          poetry run pytest tests/integration/ -v -m integration
