[project]
name = "cryptrink"
version = "0.1.0"
description = "A crypto trading agent for Revolut X with backtesting and multiple strategy support"
authors = [
    {name = "Marco Trincavelli"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
keywords = ["crypto", "trading", "bot", "revolut", "backtesting", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

dependencies = [
    # HTTP & Async
    "httpx>=0.28,<1.0",
    "websockets>=14.0,<15.0",

    # Cryptography for Revolut X Ed25519 signing
    "pynacl>=1.5,<2.0",
    "cryptography>=49.0.0,<50.0",

    # Data validation & settings
    # Cap pydantic <=2.12.5: HF's Gradio SDK force-installs gradio[oauth,mcp], and
    # gradio's `mcp` extra pins pydantic<=2.12.5,>=2.11.10. We don't use gradio's MCP
    # server, but HF injects the extra anyway, so requirements.txt must stay in that
    # window or the Space build fails to resolve. (Lift when gradio/mcp widens it.)
    "pydantic>=2.11.10,<=2.12.5",
    "pydantic-settings>=2.6,<3.0",

    # Data processing
    "pandas>=2.2,<3.0",
    "numpy>=2.5.1,<3.0",

    # Database
    "sqlalchemy>=2.0.51,<3.0",
    "aiosqlite>=0.20,<1.0",

    # CLI
    "typer>=0.27.0,<1.0",
    "rich>=13.9,<14.0",

    # Logging
    "structlog>=24.4,<25.0",

    # Configuration
    "pyyaml>=6.0,<7.0",

    # Scheduling
    "apscheduler>=3.11.3,<4.0",
    "python-dotenv (>=1.2.2,<2.0.0)",

    # Visualization for backtesting
    "matplotlib (>=3.11.1,<4.0)",
    "aiohttp (>=3.14.3,<4.0.0)",

    # Bayesian optimisation (TPE) for backtest parameter tuning
    "optuna>=4.9.0,<5.0",
]

[project.optional-dependencies]
discord = [
    "discord.py>=2.7.1,<3.0",
]
web = [
    "gradio>=6.20.0,<7.0",
    # gradio's CLI subpackage imports `requests` eagerly during `import gradio`;
    # not declaring it here breaks app.py on a clean install.
    "requests>=2.34.2,<3.0",
    # Interactive equity-curve and candlestick charts in the web UI (gr.Plot).
    "plotly>=6.9.0,<7.0",
]
all = [
    "discord.py>=2.7.1,<3.0",
    "gradio>=6.20.0,<7.0",
    "requests>=2.34.2,<3.0",
    "plotly>=6.9.0,<7.0",
]

[project.scripts]
cryptrink = "cryptrink.cli:app"

[project.urls]
Homepage = "https://github.com/trinchetto/cryptrink"
Documentation = "https://github.com/trinchetto/cryptrink/wiki"
Repository = "https://github.com/trinchetto/cryptrink"
Issues = "https://github.com/trinchetto/cryptrink/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "cryptrink", from = "src"}]

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^9.1"
pytest-asyncio = "^1.4"
pytest-cov = "^7.1"
respx = "^0.23"
pytest-mock = "^3.14"

# Linting & Formatting
ruff = "^0.16"
mypy = "^2.3"
pre-commit = "^4.6"

# Type stubs
pandas-stubs = "^3.0"
types-pyyaml = "^6.0"
types-cryptography = "^3.3.23.2"
pytest-xdist = "^3.8.0"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "RUF",    # Ruff-specific rules
    "ASYNC",  # flake8-async
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B027",   # empty method in abstract class (intentional for optional override)
    "ARG002", # unused method argument (intentional for interface definition)
    "SIM103", # return condition directly (explicit if/return is more readable)
]

[tool.ruff.lint.isort]
known-first-party = ["cryptrink"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-n=auto",  # Run tests in parallel using all available CPUs
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/cryptrink"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
